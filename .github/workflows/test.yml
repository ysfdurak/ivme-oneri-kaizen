name: Testler
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: pnpm'i etkinleştir (package.json içindeki sürüm)
        run: corepack enable
      - name: Bağımlılıkları kur (kilit dosyasına sadık)
        run: pnpm install --frozen-lockfile
      - name: Süreç, API ve entegrasyon testleri
        run: ./scripts/test.sh
